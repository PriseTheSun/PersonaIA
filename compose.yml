name: personaia

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB em .env}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Configure POSTGRES_MIGRATION_USER em .env}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Configure POSTGRES_MIGRATION_PASSWORD em .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:size=64m,mode=1777

  migrate:
    build:
      context: ./apps/api
      target: migrate
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_MIGRATION_USER}:${POSTGRES_MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Configure SUPER_ADMIN_EMAIL em .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Configure SUPER_ADMIN_PASSWORD em .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db-permissions:
    image: postgres:17-alpine
    command: ["/bin/sh", "/security/configure-runtime-role.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?Configure POSTGRES_DB em .env}
      PGUSER: ${POSTGRES_MIGRATION_USER:?Configure POSTGRES_MIGRATION_USER em .env}
      PGPASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Configure POSTGRES_MIGRATION_PASSWORD em .env}
      APP_DB_USER: ${APP_DB_USER:?Configure APP_DB_USER em .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD em .env}
    volumes:
      - ./docker/postgres/configure-runtime-role.sh:/security/configure-runtime-role.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Configure JWT_ACCESS_SECRET em .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Configure JWT_REFRESH_SECRET em .env}
      JWT_ISSUER: ${JWT_ISSUER:-personaia-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-personaia-web}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Configure SUPER_ADMIN_EMAIL em .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Configure SUPER_ADMIN_PASSWORD em .env}
    depends_on:
      db-permissions:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true

  web:
    build:
      context: ./apps/web
      target: runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    init: true

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:

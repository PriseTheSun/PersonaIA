<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e8e8e8; color: #111; font-family: Inter, Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
      figure { margin: 0; border: 1px solid #bbb; background: #fff; padding: 10px; }
      figcaption { height: 28px; font-size: 14px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Referência</figcaption><img src="/__qa-login-reference.jpg" alt="Referência" /></figure>
      <figure><figcaption>Implementação PersonaIA</figcaption><img src="/__qa-login-implementation.png" alt="Implementação" /></figure>
    </main>
  </body>
</html>

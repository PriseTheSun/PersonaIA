<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e8e8e8; color: #111; font-family: Inter, Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
      figure { margin: 0; border: 1px solid #bbb; background: #fff; padding: 10px; }
      figcaption { height: 28px; font-size: 14px; font-weight: 700; }
      .crop { position: relative; width: 530px; height: 650px; overflow: hidden; background: #fff; }
      img { position: absolute; display: block; max-width: none; }
      .reference img { left: -532px; top: -100px; width: 1127px; height: 848px; }
      .implementation img { left: -531px; top: -100px; width: 1126px; height: 852px; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Formulário da referência</figcaption><div class="crop reference"><img src="/__qa-login-reference.jpg" alt="Formulário da referência" /></div></figure>
      <figure><figcaption>Formulário PersonaIA</figcaption><div class="crop implementation"><img src="/__qa-login-implementation.png" alt="Formulário implementado" /></div></figure>
    </main>
  </body>
</html>
